name: Web editor

# Publishes the web editor (the static files in web/) to GitHub Pages. Before that the block
# catalog (web/catalog.js) and the guide for AI assistants (web/ai-guide.md) are generated
# from the app's code, so the site always matches the blocks on master.
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "app/src/main/**"
      - "app/src/test/java/cz/natsu/automation/WebCatalogExport.kt"
      - "app/src/test/java/cz/natsu/automation/AiGuideExport.kt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Building and deploying are two jobs: the deploy job starts only once the uploaded site is
  # registered, so it never looks for the artifact a moment too early.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate the block catalog and the AI guide
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests "*WebCatalogExport*" --tests "*AiGuideExport*"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
